<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6c1d9">
<title>Dávila Johana | Diseño Multimedial | Diseño y Programación Web II | Noche | DMN4BV | Vanessa Donnadio | Noviembre 2026</title>
  <link rel="stylesheet" href="./estilos.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main id="escena" aria-label="Teléfono Powerpuff Girls en 3D en Saltadilla"></main>
  <button id="sonido" type="button" class="control-sonido" title="Activar sonido"
    aria-label="Activar sonido" aria-pressed="false"></button>
  <button id="noche" type="button" class="control-sonido" aria-pressed="false" title="Modo noche">
    <span aria-hidden="true">☾</span><span class="solo-lectores">Modo noche</span>
  </button>
  <p id="estado" class="solo-lectores" role="status">Cargando teléfono</p>
  <footer class="datos-cursada">
    <p>
      <strong>Johana Dávila</strong> · Diseño Multimedial ·
      Diseño y Programación Web II
    </p>
    <p>
      Escuela Da Vinci · 2026 · DMN4BV · Turno noche ·
      Docente: Vanessa Donnadio · Segundo parcial
    </p>
  </footer>
  <button id="mover-cartel" type="button" class="solo-lectores accion-teclado">
    Mover cartel con las flechas del teclado
  </button>
  <button id="llamar" type="button" class="solo-lectores accion-teclado" disabled>
    Llamar a Saltadilla
  </button>
  <button id="atender" type="button" class="solo-lectores accion-teclado" disabled>
    Atender llamada
  </button>
  <button id="cerrar" type="button" class="solo-lectores accion-teclado" disabled>
    Cerrar llamada
  </button>
  <button id="viento" type="button" class="solo-lectores accion-teclado">
    Activar viento en las flores
  </button>
  <button id="birome" type="button" class="solo-lectores accion-teclado">
    Mover birome
  </button>
</body>
</html>
